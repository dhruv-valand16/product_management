{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ product.name }}</title>

    <link rel="stylesheet" href="{% static 'css/product.css' %}">
</head>

<body>

    <main class="product-detail">

        <div class="product-detail-image">

            {% if product.image %}
                <img
                    src="{{ product.image.url }}"
                    alt="{{ product.name }}"
                >
            {% else %}
                <div class="no-image">
                    No Image
                </div>
            {% endif %}

        </div>


        <div class="product-detail-content">

            <span class="product-category">
                {{ product.category.name }}
            </span>

            <h1>{{ product.name }}</h1>

            <p class="product-price">
                ₹{{ product.price }}
            </p>

            <p class="product-description">
                {{ product.description }}
            </p>

            <a href="{% url 'product_edit' product.id %}" class="edit-button">
                Edit Product
            </a>

            <a href="{% url 'product_delete' product.id %}" class="delete-button">
                Delete Product
            </a>

            <a href="{% url 'product_list' %}">
                Back to Products
            </a>

        </div>

    </main>

</body>

</html>
